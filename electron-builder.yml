appId: app.ghostlink.desktop
productName: Ghostlink
directories:
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
asarUnpack:
  - resources/**
  - '**/*.node'
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Ghostlink-${version}-windows-setup.${ext}
publish:
  provider: github
  owner: paavalipopov
  repo: ghostlink
  releaseType: draft
npmRebuild: false
