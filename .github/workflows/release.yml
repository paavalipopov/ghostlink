name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match package version $version"
          }

      - name: Build installer and update metadata
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload draft release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          gh release view $env:RELEASE_TAG --json id *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --draft --verify-tag --title "Ghostlink $version" --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release" }
          }
          gh release edit $env:RELEASE_TAG --title "Ghostlink $version" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw "Could not update release notes" }
          gh release upload $env:RELEASE_TAG "dist/Ghostlink-$version-windows-setup.exe" "dist/Ghostlink-$version-windows-setup.exe.blockmap" "dist/latest.yml" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload all release assets" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = @(
            "Ghostlink-$version-windows-setup.exe",
            "Ghostlink-$version-windows-setup.exe.blockmap",
            "latest.yml"
          )
          $uploaded = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect release assets" }
          foreach ($asset in $expected) {
            if ($uploaded -notcontains $asset) {
              throw "Draft release is missing $asset"
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish completed release
        shell: pwsh
        run: gh release edit $env:RELEASE_TAG --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
