name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Tauri version tag to prepare as a draft
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set up Rust MSVC
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build installer and update metadata
        shell: pwsh
        run: ./scripts/build-tauri-release.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_WINDOWS_SIGN_COMMAND: ${{ vars.TAURI_WINDOWS_SIGN_COMMAND }}

      - name: Upload draft release
        shell: pwsh
        run: |
          $version = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --draft --verify-tag --title "Ghostlink $version" --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release" }
          } elseif ($draft -ne 'true') { throw "Release $env:RELEASE_TAG is already public." }
          gh release edit $env:RELEASE_TAG --title "Ghostlink $version" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw "Could not update release notes" }
          gh release upload $env:RELEASE_TAG "dist/release/Ghostlink_${version}_x64-setup.exe" "dist/release/Ghostlink_${version}_x64-setup.exe.sig" "dist/release/latest.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload all release assets" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release assets
        shell: pwsh
        run: |
          $version = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $expected = @(
            "Ghostlink_${version}_x64-setup.exe",
            "Ghostlink_${version}_x64-setup.exe.sig",
            "latest.json"
          )
          $uploaded = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect release assets" }
          foreach ($asset in $expected) {
            if ($uploaded -notcontains $asset) {
              throw "Draft release is missing $asset"
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
